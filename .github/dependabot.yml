version: 2

updates:

  - package-ecosystem: maven
    directory: /backend/gateway-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend", "gateway"]
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: maven
    directory: /backend/identity-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend", "identity"]
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: maven
    directory: /backend/project-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend", "project"]
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: maven
    directory: /backend/dimensioning-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend", "dimensioning"]
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: docker
    directory: /backend/gateway-service
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /backend/identity-service
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /backend/project-service
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /backend/dimensioning-service
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"
      include: scope
