name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy-azure:
    name: Deploy backend on Azure VM
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE }}
          username: ${{ secrets.AZURE_VM }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/SolarEase
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            cd backend
            docker compose up -d --build
            curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
            echo "Azure deploy OK"
