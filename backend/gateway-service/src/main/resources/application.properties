spring.application.name=gateway-service
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:SolarEaseSecretKeyFor256BitHS256AlgorithmThatMustBeLong}

# Internal Services URLs
services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
services.project.url=${PROJECT_SERVICE_URL:http://localhost:8082}
services.dimensioning.url=${DIMENSIONING_SERVICE_URL:http://localhost:8083}

# Spring Cloud Gateway Configuration
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=${services.identity.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[1].id=project-service
spring.cloud.gateway.routes[1].uri=${services.project.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/projects/**, /api/clients/**, /api/demands/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[2].id=dimensioning-service
spring.cloud.gateway.routes[2].uri=${services.dimensioning.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/dimensioning/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[3].id=equipment-service
spring.cloud.gateway.routes[3].uri=${services.dimensioning.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/equipment/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[4].id=quotes-service
spring.cloud.gateway.routes[4].uri=${services.project.url}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/quotes/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[5].id=notifications-service
spring.cloud.gateway.routes[5].uri=${services.project.url}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[5].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[6].id=documents-service
spring.cloud.gateway.routes[6].uri=${services.project.url}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/documents/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[7].id=invoices-service
spring.cloud.gateway.routes[7].uri=${services.project.url}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/invoices/**
spring.cloud.gateway.routes[7].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[8].id=messages-service
spring.cloud.gateway.routes[8].uri=${services.project.url}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/messages/**
spring.cloud.gateway.routes[8].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[9].id=websocket-service
# http:// (not ws://) — SockJS needs HTTP GET /ws/info before WebSocket upgrade
spring.cloud.gateway.routes[9].uri=${services.project.url}
spring.cloud.gateway.routes[9].predicates[0]=Path=/ws/**

spring.cloud.gateway.routes[10].id=catalog-service
spring.cloud.gateway.routes[10].uri=${services.project.url}
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/catalog/**
spring.cloud.gateway.routes[10].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[11].id=health-check
spring.cloud.gateway.routes[11].uri=http://localhost:8081
spring.cloud.gateway.routes[11].predicates[0]=Path=/health
spring.cloud.gateway.routes[11].filters[0]=SetPath=/api/auth/health

spring.cloud.gateway.routes[12].id=support-service
spring.cloud.gateway.routes[12].uri=${services.project.url}
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/support/**
spring.cloud.gateway.routes[12].filters[0]=JwtAuthentication

spring.cloud.gateway.routes[13].id=files-service
spring.cloud.gateway.routes[13].uri=${services.project.url}
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/files/**
spring.cloud.gateway.routes[13].filters[0]=JwtAuthentication

# CORS Configuration
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

# Logging
logging.level.root=INFO
logging.level.com.solarease=DEBUG

# Spring Boot Actuator / Micrometer Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
