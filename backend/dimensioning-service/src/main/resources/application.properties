spring.application.name=dimensioning-service
server.port=${PORT:8083}

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solarease_dimensioning}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.solarease=DEBUG

# Ollama Manual Configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:tinyllama:latest}
# Embedding model used by the RAG pipeline (pgvector knowledge_chunks).
# nomic-embed-text produces 768-dim vectors and is hosted by Ollama like other models.
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.embedding-dimension=${OLLAMA_EMBEDDING_DIMENSION:768}
# Reindex catalog/rules into knowledge_chunks at startup (set to false in tests).
solarease.rag.reindex-on-startup=${SOLAREASE_RAG_REINDEX:true}

# Spring Boot Actuator / Micrometer Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
