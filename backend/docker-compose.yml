# =============================================================================
# SolarEase -- Unified Docker Compose stack
# All secrets MUST be defined in a .env file (see .env.example).
# Default values are placeholders that REQUIRE override in production.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Databases -- one per microservice (database-per-service pattern)
  # ---------------------------------------------------------------------------
  postgres-identity:
    image: postgres:16-alpine
    container_name: postgres-identity
    environment:
      POSTGRES_DB: solarease_identity
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d solarease_identity"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - pg_identity_data:/var/lib/postgresql/data
    networks:
      - solarease-net

  postgres-project:
    image: postgres:16-alpine
    container_name: postgres-project
    environment:
      POSTGRES_DB: solarease_projects
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d solarease_projects"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5434:5432"
    volumes:
      - pg_project_data:/var/lib/postgresql/data
    networks:
      - solarease-net

  postgres-dimensioning:
    # pgvector image bundles PostgreSQL 16 + the `vector` extension required for
    # the RAG pipeline (see KnowledgeIndexerService and VectorSearchRepository).
    image: pgvector/pgvector:pg16
    container_name: postgres-dimensioning
    environment:
      POSTGRES_DB: solarease_dimensioning
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d solarease_dimensioning"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5435:5432"
    volumes:
      - pg_dimensioning_data:/var/lib/postgresql/data
      - ./dimensioning-service/src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - solarease-net

  # ---------------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    env_file:
      - .env
    environment:
      SOLAREASE_DEMO_SEED: ${SOLAREASE_DEMO_SEED:-true}
      PORT: ${IDENTITY_PORT:-8081}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-identity:5432/solarease_identity
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-86400000}
      APP_JWT_REFRESH_EXPIRATION: ${APP_JWT_REFRESH_EXPIRATION:-604800000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres-identity:
        condition: service_healthy
    ports:
      - "${IDENTITY_PORT:-8081}:8081"
    networks:
      - solarease-net

  project-service:
    build:
      context: ./project-service
      dockerfile: Dockerfile
    container_name: project-service
    env_file:
      - .env
    environment:
      SOLAREASE_DEMO_SEED: ${SOLAREASE_DEMO_SEED:-true}
      PORT: ${PROJECT_PORT:-8082}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-project:5432/solarease_projects
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      N8N_ENABLED: ${N8N_ENABLED:-true}
      N8N_INVOICE_WEBHOOK_URL: ${N8N_INVOICE_WEBHOOK_URL:-http://n8n:5678/webhook/solarease-invoice}
      N8N_INTERNAL_SECRET: ${N8N_INTERNAL_SECRET:-change_me_n8n_secret}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres-project:
        condition: service_healthy
    ports:
      - "${PROJECT_PORT:-8082}:8082"
    networks:
      - solarease-net

  dimensioning-service:
    build:
      context: ./dimensioning-service
      dockerfile: Dockerfile
    container_name: dimensioning-service
    env_file:
      - .env
    environment:
      PORT: ${DIMENSIONING_PORT:-8083}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-dimensioning:5432/solarease_dimensioning
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-tinyllama:latest}
    depends_on:
      postgres-dimensioning:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "${DIMENSIONING_PORT:-8083}:8083"
    networks:
      - solarease-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - solarease-net

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    env_file:
      - .env
    environment:
      PORT: ${GATEWAY_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PROJECT_SERVICE_URL: http://project-service:8082
      DIMENSIONING_SERVICE_URL: http://dimensioning-service:8083
    depends_on:
      - identity-service
      - project-service
      - dimensioning-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - solarease-net

  # ---------------------------------------------------------------------------
  # Workflow automation (optional -- demand intake automations)
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=${NODE_ENV:-production}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Tunis}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # Optional: provide SMTP and DB connection info for convenience. Configure
      # actual credentials inside n8n UI (Credentials) for security.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - N8N_DB_TYPE=${N8N_DB_TYPE:-sqlite}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - solarease-net

# =============================================================================
volumes:
  pg_identity_data:
  pg_project_data:
  pg_dimensioning_data:
  ollama_data:
  n8n_data:

networks:
  solarease-net:
    driver: bridge
