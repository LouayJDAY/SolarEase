spring.application.name=project-service
server.port=${PORT:8082}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solarease_projects}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Frontend URL used in invitation links
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Email / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.from=${SPRING_MAIL_USERNAME:}

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Client + projet démo — Docker: SOLAREASE_DEMO_SEED=true (UUID alignés avec identity-service)
solarease.demo-seed=${SOLAREASE_DEMO_SEED:false}

# n8n — envoi automatique facture par e-mail
solarease.n8n.enabled=${N8N_ENABLED:false}
solarease.n8n.invoice-webhook-url=${N8N_INVOICE_WEBHOOK_URL:http://n8n:5678/webhook/solarease-invoice}
solarease.n8n.internal-secret=${N8N_INTERNAL_SECRET:change_me_n8n_secret}

# Local file uploads (field photos)
solarease.upload.dir=${UPLOAD_DIR:/app/uploads}
solarease.upload.max-photo-bytes=${UPLOAD_MAX_PHOTO_BYTES:5242880}
solarease.upload.max-message-attachment-bytes=${UPLOAD_MAX_MESSAGE_ATTACHMENT_BYTES:10485760}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Spring Boot Actuator / Micrometer Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
